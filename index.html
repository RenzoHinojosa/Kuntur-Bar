<!doctype html>
<html lang="es" data-theme="noche">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chakana.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kuntur: bar de coctelería andina en Huancayo. Carta de tragos y reservas." />
    <title>Kuntur · Coctelería andina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Evita el "parpadeo" de tema antes de que React monte
      try {
        var t = JSON.parse(localStorage.getItem('kuntur-tema'));
        if (t === 'dia' || t === 'noche') document.documentElement.dataset.theme = t;
      } catch (e) { /* sin acceso a localStorage */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
